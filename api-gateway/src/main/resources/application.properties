server.port=8080
spring.application.name=api-gateway

spring.cloud.gateway.server.webflux.routes[0].id=hotel-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://hotel-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/hotels/**,/api/rooms/**

spring.cloud.gateway.server.webflux.routes[1].id=booking-service-user
spring.cloud.gateway.server.webflux.routes[1].uri=lb://booking-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/user/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[2].id=booking-service-booking
spring.cloud.gateway.server.webflux.routes[2].uri=lb://booking-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/booking/**

spring.cloud.gateway.server.webflux.routes[3].id=booking-service-bookings
spring.cloud.gateway.server.webflux.routes[3].uri=lb://booking-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/bookings/**

spring.cloud.gateway.server.webflux.routes[4].id=booking-swagger
spring.cloud.gateway.server.webflux.routes[4].uri=lb://booking-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

spring.cloud.gateway.server.webflux.routes[5].id=hotel-swagger
spring.cloud.gateway.server.webflux.routes[5].uri=lb://hotel-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/hotel-swagger/**

